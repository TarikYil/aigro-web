<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>AIgro taşındı</title>
<meta name="robots" content="noindex">
<script>
  // /aigro-web/<sayfa> -> https://aigrotech.github.io/<sayfa>
  var p = location.pathname.replace(/^\/aigro-web\/?/, "");
  location.replace("https://aigrotech.github.io/" + p + location.search + location.hash);
</script>
</head>
<body><p>AIgro sitesi taşındı: <a href="https://aigrotech.github.io/">aigrotech.github.io</a></p></body>
</html>
